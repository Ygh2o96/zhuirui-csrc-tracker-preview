name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          set -euo pipefail
          mkdir -p _site/assets/pipeline _site/data
          cp index.html sponsor-leaderboard.html sponsor_leaderboard_demo.html app.js styles.css sponsor_leaderboard_demo.css sponsor_leaderboard_demo.js deal_diagram_kit.css deal_diagram_kit.js LICENSE llms.txt robots.txt CNAME .nojekyll _site/
          cp assets/favicon.svg _site/assets/
          cp assets/pipeline/*.png _site/assets/pipeline/
          cp data/csrc_tracker_public.json _site/data/
          cp data/sponsor_leaderboard_demo.json _site/data/
          cp data/sponsor_leaderboard_demo_data.js _site/data/
          cp data/offering_fees.json _site/data/
          cp data/offering_dossiers.json _site/data/
          cp data/fee_roster.json _site/data/
          cp data/transaction_cases.json _site/data/

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
              jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" \
                '[.artifacts[] | select(.name == $name and (.id|tostring) == $id and .expired == false)] | length == 1' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact is not yet visible to GitHub Actions."
          exit 1

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Allow Pages artifact lookup to settle
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 20

      - name: Retry deploying the same artifact once
        id: deployment-retry
        if: ${{ success() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
